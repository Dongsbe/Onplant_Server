<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnPlant Film Capture</title>
  <link rel="stylesheet" href="/static/film_capture.css?v=film4">
</head>
<body class="film-capture">
  <main class="film-page film-wide film-combined-page">
    <header class="film-title">
      <div>
        <h1>실시간 주행 모니터링</h1>
        <p>LiDAR 맵, 실행 상태, 실행 로그를 한 화면에 표시합니다.</p>
      </div>
      <div class="film-clock" id="filmClock">--:--:--</div>
    </header>

    <section class="film-combined-grid">
      <article class="panel film-panel film-lidar-panel film-combined-lidar">
        <div class="film-section-head">
          <h2>LiDAR 실시간 맵</h2>
          <span class="film-meta" id="filmObstacle">clear / 0 pts</span>
        </div>
        <canvas id="filmLidarCanvas" width="900" height="900"></canvas>
        <div class="film-lidar-legend">
          <span><i class="dot robot"></i>로봇</span>
          <span><i class="dot point"></i>감지점</span>
          <span><i class="dot danger"></i>전방 위험</span>
        </div>
      </article>

      <aside class="film-combined-side">
        <article class="panel film-panel film-status-panel">
          <div class="film-section-head">
            <h2>실행 상태</h2>
            <span class="film-meta">실시간 갱신</span>
          </div>
          <pre id="filmStatus" class="film-status">현재 상태: IDLE
최근 입력: 대기 중
현재 동작: STOP
현재 조도: --
목표 조도: --
최고 조도: --
현재 좌표: --
목표 좌표: --
실행 상태: 대기
남은 시간: --
장애물 상태: clear</pre>
        </article>

        <article class="panel film-panel film-terminal-panel">
          <div class="film-section-head">
            <h2>실행 로그</h2>
            <span class="film-meta">명령과 FSM 상태 변화</span>
          </div>
          <pre id="filmLogRows" class="film-terminal">입력 대기 상태입니다.</pre>
        </article>
      </aside>
    </section>
  </main>
  <script src="/static/film_capture.js?v=film2"></script>
</body>
</html>
